function options(){if(T===2)return Object.keys(LAY).flatMap(l=>['Build','Run'].map(p=>l+'-'+p));if(T===3)return Object.values(assetMap).concat('mcp-detail');if(T===4)return Object.keys(delivery).map((_,i)=>'delivery-'+i+'-'+BP);if(T===5)return['discovery','Onboarding-Run','Registration-Run'];return[]}
function active(){if(T===2)return LY+'-'+BP;if(T===3)return assetMap[AS];if(T===4)return'delivery-'+deliveryIndex+'-'+BP;return'discovery'}
function scopeHtml(m){return `<section class="scope-box"><h3>Scope, platform mapping and unresolved dependencies</h3><p><strong>Selected context:</strong> ${esc2(m.title)}</p><p><strong>Scope:</strong> ${esc2(m.scope)}</p><p><strong>Platform mapping:</strong> ${esc2(m.mapping)}</p><p><strong>Unresolved dependencies:</strong> ${esc2(m.dependencies)}</p><p class="context-note">This panel describes the selected flow; it is not another tab or a navigation control. Selecting a layer or Build/Run changes the flow and this panel together.</p></section>`}
function install(){document.querySelectorAll('#nv button[data-t="6"]').forEach(b=>b.remove());document.querySelectorAll('#nv button').forEach((b,i)=>b.textContent=b.textContent.replace(/^\d+\./,(i+1)+'.'));if(T===6){T=7;R();return}if(V!=='Technical')return;if(T===1){ecosystem();return}if(![2,3,4,5].includes(T))return;let c=document.getElementById('c');chosen=active();let m=flows[chosen];if(!m)return;let old=c.innerHTML;c.innerHTML=scopeHtml(m)+old;let host=document.createElement('section');host.id='new-workbench';host.innerHTML=`<h3>Technical swimlane · ${esc2(m.title)}</h3><div class="workbar"><label>Relevant flow <select id="sl-select" aria-label="Relevant flow">${options().map(k=>`<option value="${k}" ${k===chosen?'selected':''}>${esc2(flows[k].title)}</option>`).join('')}</select></label><button class="btn" id="zminus">−</button><button class="btn" id="zplus">+</button><button class="btn" id="zfit">Fit width</button><button class="btn" id="zreset">Readable size</button><label><input type="checkbox" id="expath" ${showExceptions?'checked':''}> Rework / exception paths</label><button class="btn" id="svgexport">Export SVG</button></div><p class="context-note">Numbered sequence = normal path; diamonds = gates; dashed orange = rework. Arrow captions are proposed handoff semantics. Select a step for control and evidence details. Integration mechanisms and acknowledgment contracts are TBD.</p><div class="diagram-scroll" id="diagram-scroll" tabindex="0"></div><div id="node-details" aria-live="polite"></div><details><summary>Control and evidence register</summary><div class="w" id="control-register"></div></details>`;c.append(host);document.getElementById('sl-select').onchange=e=>{let k=e.target.value;if(T===2){let z=k.lastIndexOf('-');LY=k.slice(0,z);BP=k.slice(z+1);save();R()}else if(T===3){if(k==='mcp-detail'){chosen=k;localRender()}else{AS=Object.keys(assetMap).find(a=>assetMap[a]===k);save();R()}}else if(T===4){deliveryIndex=+k.split('-')[1];R()}else{chosen=k;localRender()}};
['zminus','zplus','zfit','zreset'].forEach(id=>document.getElementById(id).onclick=()=>{scale=id==='zminus'?Math.max(.15,scale-.15):id==='zplus'?Math.min(2,scale+.15):id==='zreset'?1:Math.max(.08,(document.getElementById('diagram-scroll').clientWidth-10)/geo().W);draw()});document.getElementById('expath').onchange=e=>{showExceptions=e.target.checked;draw()};document.getElementById('svgexport').onclick=()=>{let el=document.querySelector('#diagram-scroll svg').cloneNode(true);el.setAttribute('width',geo().W);el.setAttribute('height',geo().H);let u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(el)],{type:'image/svg+xml'}));let a=document.createElement('a');a.href=u;a.download=chosen+'-swimlane.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};nodeIndex=0;draw()}
function localRender(){let m=flows[chosen];document.querySelector('.scope-box').outerHTML=scopeHtml(m);document.querySelector('#new-workbench h3').textContent='Technical swimlane · '+m.title;nodeIndex=0;draw()}
function geo(){let m=flows[chosen],used=[...new Set(m.rows.map(n=>n.lane))].sort((a,b)=>a-b);return{m,used,W:235+m.rows.length*245,H:used.length*122+90,pos:(n,i)=>({x:235+i*245,y:60+used.indexOf(n.lane)*122})}}
function lines(t,max=25){let out=[],l='';t.split(' ').forEach(w=>{if((l+' '+w).trim().length>max){out.push(l);l=w}else l=(l+' '+w).trim()});if(l)out.push(l);return out}
function draw(){let{m,used,W,H,pos}=geo();let g=`<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc2(m.title)}" width="${W*scale}" height="${H*scale}" viewBox="0 0 ${W} ${H}"><title>${esc2(m.title)}</title><defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#466780"/></marker></defs><rect width="${W}" height="${H}" fill="white"/>`;
used.forEach((l,i)=>{let y=40+i*122;g+=`<rect x="0" y="${y}" width="${W}" height="122" fill="${i%2?'#f0f5f9':'#fff'}" stroke="#d5dfe9"/><rect x="0" y="${y}" width="220" height="122" fill="#e3edf6"/><text x="12" y="${y+40}" fill="#193247" font-size="13">${lines(laneNames[l],24).map((v,j)=>`<tspan x="12" dy="${j?19:0}">${esc2(v)}</tspan>`).join('')}</text>`});
m.rows.forEach((n,i)=>{let a=pos(n,i);if(i<m.rows.length-1){let b=pos(m.rows[i+1],i+1),x=a.x+215;g+=`<path d="M${a.x+188} ${a.y+38}H${x}V${b.y+38}H${b.x}" stroke="#466780" stroke-width="2" fill="none" marker-end="url(#arrow2)"/><text x="${a.x+190}" y="${Math.min(a.y,b.y)+12}" fill="#193247" font-size="10">${n.gate?'Yes / approved':'Outcome ref'}</text>`}if(n.gate&&showExceptions&&i>0){let b=pos(m.rows[i-1],i-1),y=Math.min(a.y,b.y)-14;g+=`<path d="M${a.x+94} ${a.y}V${y}H${b.x+94}V${b.y}" fill="none" stroke="#ab5b10" stroke-dasharray="5 4" marker-end="url(#arrow2)"/><text x="${b.x+100}" y="${y-4}" fill="#9b4d0a" font-size="11">No / uncertain — rework or triage</text>`}});
m.rows.forEach((n,i)=>{let a=pos(n,i);g+=`<g class="diagram-node" role="button" tabindex="0" data-node="${i}" aria-label="${n.id} ${esc2(n.label)}"><title>${esc2(n.detail)}</title>`;g+=n.gate?`<polygon points="${a.x+94},${a.y-6} ${a.x+192},${a.y+38} ${a.x+94},${a.y+82} ${a.x-4},${a.y+38}" fill="#fff0d6" stroke="#9a772c" stroke-width="2"/>`:`<rect x="${a.x}" y="${a.y}" width="188" height="76" rx="9" fill="#e4eff8" stroke="#466780" stroke-width="1.5"/>`;g+=`<text x="${a.x+94}" y="${a.y+18}" text-anchor="middle" font-size="11" fill="#193247" font-weight="700">${n.id}${n.gate?' · GATE':''}</text><text x="${a.x+94}" y="${a.y+37}" text-anchor="middle" font-size="11" fill="#193247">${lines(n.label).map((v,j)=>`<tspan x="${a.x+94}" dy="${j?15:0}">${esc2(v)}</tspan>`).join('')}</text></g>`});g+='</svg>';document.getElementById('diagram-scroll').innerHTML=g;document.querySelectorAll('[data-node]').forEach(el=>{el.onclick=()=>{nodeIndex=+el.dataset.node;detail()};el.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();el.click()}if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let k=Math.max(0,Math.min(m.rows.length-1,+el.dataset.node+(e.key==='ArrowRight'?1:-1)));document.querySelector(`[data-node="${k}"]`).focus();nodeIndex=k;detail()}}});document.getElementById('control-register').innerHTML='<table><thead><tr><th>Step</th><th>Responsible capability</th><th>Control intent</th><th>Evidence / contract</th></tr></thead><tbody>'+m.rows.map(n=>`<tr><td>${n.id} ${esc2(n.label)}</td><td>${laneNames[n.lane]}</td><td>${esc2(n.detail)}</td><td>Timestamp, outcome, responsible actor and record references. Evidence location, requirement mapping and contract TBD.</td></tr>`).join('')+'</tbody></table>';detail()}
function detail(){let m=flows[chosen],n=m.rows[nodeIndex],next=m.rows[nodeIndex+1];let d={'Responsible capability':laneNames[n.lane],'Control / action':n.detail,'Input':nodeIndex?m.rows[nodeIndex-1].id+' outcome and associated record references':'Request, event or lifecycle trigger with provenance','Output / receiver':next?next.id+' · '+laneNames[next.lane]+' · outcome and linked identifiers':'End of this subprocess; retain evidence and hand off to linked lifecycle process','Failure / timeout':n.gate?'No/uncertain: rework, reject or designated triage. Exceptions need approved authority and expiry.':'Record failure; bounded retry only if approved; escalate to responsible owner. Targets TBD.','Evidence / control mapping':'Dated outcome, actor, approval/policy references, control tests where applicable. Requirement IDs, evidence store, retention and accountable role TBD.','Integration semantics':'Proposed handoff; transport, synchronous/asynchronous contract and success acknowledgment TBD. Telemetry emissions are asynchronous where applicable.','Correlation and privacy':'Request, asset, principal, deployment, grant, trace, case and factsheet IDs as available. No credentials or raw tokens. Sensitive payload retention requires policy.'};document.getElementById('node-details').innerHTML=`<section class="step-detail"><h4>${n.id} — ${esc2(n.label)}</h4><dl>${Object.entries(d).map(([k,v])=>`<dt>${esc2(k)}</dt><dd>${esc2(v)}</dd>`).join('')}</dl></section>`}
function ecosystem(){const c=document.getElementById('c');c.innerHTML=`<h3>Enterprise agent ecosystem — based on your architecture sketch</h3><p class="context-note">The capability groups and agent populations below follow the supplied image. The sketch contains no directional connectors: the relationship descriptions below are proposed interpretations, not confirmed integration contracts.</p><div class="eco-layout"><section class="eco-box"><h3>Agent Onboarding</h3><div class="eco-mini">Use Case Factory — purpose, sponsorship and ownership</div><div class="grid"><div class="eco-mini">ITSM Process — intake, approvals, change and remediation</div><div class="eco-mini">CMDB — inventory / service relationships; asset-record authority TBD</div></div></section><section class="eco-box eco-red eco-policy"><h3>Cross-cutting Policy</h3><div class="eco-mini">Authentication (AuthN)</div><div class="eco-mini">Authorization (AuthZ)</div><div class="eco-mini">Intent Guardrails</div><div class="eco-mini">Logs / Monitoring</div><p class="context-note">Shown vertically across onboarding and governance in the source sketch. Exact policy decision and enforcement components TBD.</p></section><section class="eco-box"><h3>Human & Agent Identity & Access</h3><p>Agent Access Management</p><div class="grid"><div class="eco-mini">Human Identity</div><div class="eco-mini">Non-Human Identity</div></div><p class="context-note">Asset, principal and deployment records remain distinct. Human MFA is not workload authentication.</p></section><section class="eco-box eco-red eco-gov"><h3>Governance Plane</h3><div class="eco-tags">${['API Gateway','Agent Gateway','MCP Gateway','LLM Gateway','Truthfulness','Trustworthiness'].map(x=>`<span class="eco-tag">${x}</span>`).join('')}</div><p class="context-note">Logical control capabilities, not a mandate for four separate products. Truthfulness/trustworthiness are assurance objectives requiring defined measures and evidence, not guaranteed outcomes.</p></section></div><div class="eco-pop"><section class="eco-box"><h3>Backoffice Agents</h3><ul>${['HR','Administrative','Legal','Risk','Compliance','Procurement','Finance','Accounting / Bookkeeping','Payroll','IT Support'].map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="eco-box eco-blue"><h3>Product Agents</h3><div class="eco-mini"><h4>Enterprise Agents</h4>OCR · IVR · Image / Document Processing</div><div class="grid"><div class="eco-mini">Business Products</div><div class="eco-mini">Common Functions</div><div class="eco-mini">Data Ops</div></div></section><section class="eco-box eco-green"><h3>SDLC Agents</h3><ul>${['App Development','Quality Engineering','CI/CD / DevOps','SRE','AIOps','Infrastructure','Network Optimization','ITSM','Release Management'].map(x=>`<li>${x} Agents</li>`).join('')}</ul><hr><h4>Cybersecurity Agents</h4>AppSec · InfoSec · SecOps<br>Red Team · Pen Test</section></div><h3>Proposed relationships and lifecycle handoffs</h3><div class="w"><table><thead><tr><th>From</th><th>To</th><th>Relationship</th><th>Implementation detail</th></tr></thead><tbody><tr><td>All agent populations</td><td>Use Case Factory / ITSM</td><td>Onboard, approve and assign ownership</td><td>Onboarding Build; discovery routes to Onboarding Run</td></tr><tr><td>Approved intake</td><td>CMDB / registration + identity</td><td>Link asset, owner, principal and deployment</td><td>Registration Build / Run; authority TBD</td></tr><tr><td>Runtime agent / tool calls</td><td>Governance gateways and resources</td><td>Evaluate applicable policy and authorize actions</td><td>Guardrails Run; in-path coverage and bypass documented</td></tr><tr><td>Policy, gateways, identities and runtimes</td><td>Logs / monitoring and remediation</td><td>Correlate evidence and route findings</td><td>Observability Run → owner resolution → registration</td></tr></tbody></table></div><details><summary>Product mapping and validation boundaries</summary><p>Existing IAM/CIAM is stakeholder-provided context. Candidate identity: Entra / Okta / SlashID; access governance: SailPoint; architecture factsheets: LeanIX; security/operations: Splunk, Dynatrace and other candidate tools. No deployment or integration is asserted. ServiceNow AI Control Tower remains future / out of scope. MCP servers are integration assets and may link to non-human principals; they are not identities themselves.</p></details>`}
const original=R;R=function(){if(T===6)T=7;original();install()};

['q','fs','fc','fp'].forEach(id=>{let el=document.getElementById(id);if(el)el.value=''});

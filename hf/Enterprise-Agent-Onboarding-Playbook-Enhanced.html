ontrol tests, ownership, telemetry, rollback and access baseline.',1], [9,'Deploy / publish','Record release, deployment, environment, endpoint and identity references.'],[12,'Verify live operation','Confirm telemetry and asset/identity/deployment correlation; investigate failures.'],[14,'Link architecture evidence','Update proposed LeanIX factsheet and retain links to evidence systems, not secrets or raw telemetry.'],[7,'Activate certification','Record next review, operational ownership and expiry. End: enabled and monitored.']]);

[9,'Receive trigger','User request, schedule, API call or event; establish request/trace context.'],[9,'Resolve execution context','Link deployment, environment, asset and principal; identify autonomous or delegated execution.'],[6,'Authenticate principal','Human MFA where applicable; workloads use approved noninteractive authentication.'],[6,'Valid authorization context?','Validate issuer, audience, expiry and scopes at the responsible verifier.',1], [9,'Evaluate policy baseline','Choose cached policy, deployment attestation, runtime lookup or reconciliation. Registry lookup per request is not assumed.'],[9,'Plan tool action','Model output proposes an action; it is not an authorization decision.'],[10,'Action permitted?','Evaluate tool/action restrictions. Sensitive actions may require explicit human approval.',1], [6,'Obtain downstream access','Separate user-delegated and autonomous access; respect token audience and downstream permission boundaries.'],[10,'Apply gateway controls','Only in-path traffic is observed/enforced. Document bypass and unmanaged traffic.'],[11,'Resource authorization','Resource validates applicable identity and permissions independently of gateway decisions.'],[11,'Execute operation','Distinguish read from state-changing operations; require approved sensitive-action controls.'],[9,'Return controlled result','Apply applicable output/data handling policies; do not assume full payload logging is permitted.'],[12,'Emit / correlate telemetry','Asynchronous events link asset, identity, deployment, trace and resource where available.'],[12,'Violation or unknown asset?','Correlate evidence and confidence; route incidents or unregistered findings.',1], [13,'Authorize response','Approved policy and risk determine alert, restriction, quarantine or suspension; missing registration alone does not imply blocking.'],[9,'Verify enforcement','Validate effect, retain evidence and define recovery/rollback approval.']]);
r.extra=[{from:3,to:14,label:'Invalid — deny / investigate',type:'exception'},{from:6,to:14,label:'Deny / approval timeout',type:'exception'},{from:13,to:0,label:'No issue — next invocation',type:'rework'}];

[10,'Observe candidate signal','API management, agent gateway, runtime inventory, IAM/CIAM, L3 network, session-related or L7 evidence. Candidate products do not imply deployed coverage.'],[12,'Normalize finding','Record source, time, endpoint, environment, principal if known, confidence and evidence pointer.'],[5,'Correlate inventories','Match asset registry, principal inventory, deployment, CMDB where available and architecture references.'],[12,'Confident match?','Network/session evidence alone cannot prove agent identity. Multiple or insufficient matches need review.',1], [5,'Determine registration state','Registered/compliant, noncompliant, missing, duplicate, stale, exception or false positive.'],[13,'Resolve accountable owner','Use identity ownership, project/account, repository, deployment or CMDB metadata; preserve attribution provenance.'],[13,'Owner confirmed?','Require confirmed ownership; do not fabricate an owner from a weak correlation.',1], [2,'Create / link case','Deduplicate finding, attach evidence, risk, owner confidence and target dates TBD.'],[4,'Evaluate response policy','Risk, business impact, evidence confidence and exception status govern action. No automatic block solely for a missing record.'],[0,'Choose disposition','Register, link existing, correct metadata, retire, request exception or contest false positive.'],[2,'Onboarding / change review','Reuse Build approval gates; do not duplicate a valid identity or asset record.'],[5,'Reconcile registration','Link owners, deployment and identities to approved baseline.'],[12,'Remediation effective?','Confirm registration, ownership, effective controls and reconciled runtime evidence.',1], [13,'Close with evidence','Record disposition; reopen on recurrence, expired exception or failed validation.']]);
d.extra=[{from:3,to:5,label:'Uncertain — manual triage',type:'exception'},{from:6,to:7,label:'No — unknown-owner queue',type:'exception'},{from:12,to:7,label:'No — escalate / reopen',type:'rework'}];
model('M','MCP server — integration onboarding',[[1,'Define server / tools','Separate MCP client, server, authorization server and downstream resource. Server is an integration asset, not inherently an identity.'],[2,'Submit endpoint and owners','Capture purpose, hosting, exposure, transport and tools offered.'],[3,'Review trust boundaries','Assess clients, external dependencies and resource boundaries.'],[4,'Approve access design?','Assess delegated/autonomous access, sensitive tools and resource permissions.',1],[5,'Register integration','Link server record to service/workload identity where applicable.'],[6,'Configure authorization','Validate intended audiences, permission boundaries and approved credential references.'],[10,'Configure gateway coverage','Identify covered paths, bypass paths and endpoint controls.'],[11,'Validate resource controls','Test allow/deny, tool permissions and downstream authorization; never blindly forward unrelated tokens.'],[12,'Publish and monitor','Link endpoint, server asset, principal and runtime evidence.']]);
model('P','Pro-code — repository to runtime',[[1,'Repository and owners','Link repository to accountable team and asset. Framework examples: Strands, CrewAI, LangGraph, LangChain.'],[8,'Code / dependency review','Evidence and specific automated checks require validation.'],[8,'Pipeline security checks','Proposed GitHub Actions and Depthfirst integration; no unverified API assumptions.'],[8,'Checks passed?','Record findings and gate outcome; failures block release unless approved exception.',1],[8,'Version artifact','Record version, provenance, release and deployment references.'],[5,'Validate registration','Verify target environment and linked Asset ID.'],[6,'Link deployment identity','Prefer approved noninteractive authentication pattern; avoid long-lived secret exposure.'],[8,'Authorize deployment','Record approval, rollback readiness and approved access baseline.'],[9,'Deploy / verify','Validate control configuration and runtime behavior.'],[12,'Correlate telemetry','Link trace, asset, principal and deployment; hand off to Run view.']]);
model('L','Lifecycle — certify, change, suspend, retire',[[7,'Review or change trigger','Scheduled certification, ownership change, access expansion, incident or expiry.'],[0,'Confirm owner / purpose','Ownership transfer requires new owner acceptance.'],[7,'Review actual access','Compare actual entitlements and tool use with approved baseline.'],[4,'Retain, change or retire?','Risk reassessment and approvals required for scope expansion.',1],[1,'Implement approved change','Test modified scopes, tools, configuration and credentials; revoke replaced credentials as applicable.'],[9,'Suspend / stop if required','Runtime stop and token/access revocation are distinct; existing tokens may have different invalidation behavior.'],[6,'Revoke / reduce access','Check shared identities and integrations before destructive changes.'],[5,'Update lifecycle record','Record certification, owner, baseline, exception expiry or retirement.'],[14,'Retain evidence references','Update architecture factsheet and evidence links under retention policy.'],[12,'Verify outcome','Verify no unexpected continued activity; recovery requires approval.']]);
model('C','Managed / AI-assisted delivery',[[1,'Select workspace / cohort','Stakeholder cohorts: Cursor/Copilot (also code-capable), Workato/Bedrock (implementation-dependent). Validate edition and use case.'],[6,'Authorize builder access','Apply human identity, MFA and platform entitlement controls where applicable.'],[1,'Configure workflow / agent','Identify data boundaries, connectors, connection identities and requested actions.'],[4,'Review connector permissions?','Approve scopes, data handling and publication conditions.',1],[5,'Link registration','Record owners, platform, environment and identity references.'],[9,'Apply platform controls','Distinguish enterprise-managed and platform-managed controls; document automation gaps and compensating controls.'],[9,'Publish / enable','Capture publication approval and rollback/disable mechanism.'],[12,'Verify runtime evidence','Confirm telemetry coverage and residual risks. Code artifacts entering a repository use Pro-code flow.']]);

function install(){if(V!=='Technical'||T===7)return;const c=document.getElementById('c');if(document.getElementById('sl-app'))return;selected=defaultModel();let h=document.createElement('section');h.id='sl-app';h.innerHTML=`<h3>Technical swimlane workbench</h3><p class="sl-note">Proposed architecture — validation required. Candidate products are not confirmed integrations. Activity labels describe target controls, not evidence of deployed maturity.</p><div class="sl-head"><label>Diagram <select id="sl-select">${Object.values(models).map(m=>`<option value="${m.id}">${m.title}</option>`).join('')}</select></label><button class="btn" id="sl-minus" aria-label="Zoom out">−</button><button class="btn" id="sl-plus" aria-label="Zoom in">+</button><button class="btn" id="sl-fit">Fit width</button><button class="btn" id="sl-normal">Readable size</button><label><input id="sl-branches" type="checkbox" checked> Exception / rework routes</label><button class="btn" id="sl-export">Export SVG</button><button class="btn" id="sl-print">Print view</button></div><div class="sl-legend">Rounded activity · Diamond decision · Orange return: rework/exception · Arrow label: handoff payload · Select a step for controls and evidence. Main path begins at first numbered step and ends at last.</div><div class="sl-scroll" id="sl-scroll" tabindex="0" aria-label="Scrollable technical swimlane"></div><div id="sl-detail" aria-live="polite"></div><details><summary>Control, evidence and handoff register</summary><div class="w" id="sl-register"></div></details><details><summary>Scope, platform mapping and unresolved dependencies</summary><p>MVP: common schema, ownership, approvals, identity links and manual/semi-automated discovery routing. Later / Out of scope: ServiceNow AI Control Tower integration. Entra Agent ID / Agent 365 licensing, SailPoint Agent Fabric naming, Oasis Security, SlashID, Okta, API gateways, Splunk, Dynatrace, Wiz, Netskope, Noma Security, CyberArk and WIREX mappings require enterprise validation. OAuth is a protocol, not a product. LeanIX holds architecture references; evidence storage location is TBD.</p><p>Authoritative records, integration mechanisms, timeout/retry limits, retention, exception approvers, enforcement policy and service-level targets remain TBD. This prototype does not make live security decisions.</p></details>`;c.prepend(h);document.getElementById('sl-select').value=selected;
 document.getElementById('sl-select').onchange=e=>{selected=e.target.value;focus=0;zoom=1;draw()};document.getElementById('sl-plus').onclick=()=>{zoom=Math.min(1.8,zoom+.15);draw()};document.getElementById('sl-minus').onclick=()=>{zoom=Math.max(.2,zoom-.15);draw()};document.getElementById('sl-fit').onclick=()=>{zoom=Math.max(.08,(document.getElementById('sl-scroll').clientWidth-20)/geometry().W);draw()};document.getElementById('sl-normal').onclick=()=>{zoom=1;draw()};document.getElementById('sl-branches').onchange=e=>{branches=e.target.checked;draw()};document.getElementById('sl-print').onclick=()=>window.print();document.getElementById('sl-export').onclick=()=>{let svg=document.querySelector('#sl-scroll svg').cloneNode(true);svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('width',geometry().W);svg.setAttribute('height',geometry().H);let u=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));let a=document.createElement('a');a.href=u;a.download='swimlane-'+selected+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};draw()}
function geometry(){let m=models[selected],used=[...new Set(m.nodes.map(n=>n.lane))].sort((a,b)=>a-b);return{m,used,W:240+m.nodes.length*220,H:used.length*112+90,pos:n=>({x:240+m.nodes.indexOf(n)*220,y:55+used.indexOf(n.lane)*112})}}
function wrap(t,n=23){let a=[],line='';t.split(' ').forEach(w=>{if((line+' '+w).trim().length>n){a.push(line);line=w}else line=(line+' '+w).trim()});if(line)a.push(line);return a}
function draw(){let {m,used,W,H,pos}=geometry();let g=`<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${xesc(m.title)}" width="${W*zoom}" height="${H*zoom}" viewBox="0 0 ${W} ${H}" style="font-family:system-ui,sans-serif"><title>${xesc(m.title)}</title><defs><marker id="sl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#42637b"/></marker></defs><rect width="${W}" height="${H}" fill="white"/>`;
used.forEach((l,i)=>{let y=35+i*112;g+=`<rect x="0" y="${y}" width="${W}" height="112" fill="${i%2?'#f1f5f9':'#fff'}" stroke="#d6dfe7"/><rect x="0" y="${y}" width="225" height="112" fill="#e6eef6"/><text x="12" y="${y+40}" fill="#193047" font-size="13">${wrap(lanes[l],26).map((t,j)=>`<tspan x="12" dy="${j?19:0}">${xesc(t)}</tspan>`).join('')}</text>`});
m.nodes.forEach((n,i)=>{if(i===m.nodes.length-1)return;let a=pos(n),b=pos(m.nodes[i+1]),mid=a.x+196;g+=`<path d="M${a.x+176} ${a.y+36} H${mid} V${b.y+36} H${b.x}" fill="none" stroke="#42637b" stroke-width="2" marker-end="url(#sl-arrow)"/><text x="${a.x+180}" y="${Math.min(a.y,b.y)+12}" font-size="10" fill="#315269">${n.decision?'Yes / approved':'Record ref'}</text>`});
if(branches)m.extra.forEach((e,i)=>{let a=pos(m.nodes[e.from]),b=pos(m.nodes[e.to]);let y=44+Math.min(a.y,b.y)-((i%2)*10);g+=`<path d="M${a.x+88} ${a.y} V${y} H${b.x+88} V${b.y}" fill="none" stroke="#a6530b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#sl-arrow)"/><text x="${Math.min(a.x,b.x)+95}" y="${y-4}" fill="#914407" font-size="11">${xesc(e.label)}</text>`});
m.nodes.forEach((n,i)=>{let a=pos(n);g+=`<g class="sl-node" role="button" tabindex="0" aria-label="${n.id} ${xesc(n.label)}" data-step="${i}"><title>${xesc(n.detail)}</title>`;g+=n.decision?`<polygon points="${a.x+88},${a.y-8} ${a.x+180},${a.y+36} ${a.x+88},${a.y+80} ${a.x-4},${a.y+36}" fill="#fff3dc" stroke="${i===focus?'#b4610a':'#997325'}" stroke-width="2"/>`:`<rect x="${a.x}" y="${a.y}" width="176" height="72" rx="9" fill="${i===focus?'#d2e8fa':'#e9f2fa'}" stroke="#42637b" stroke-width="${i===focus?3:1.5}"/>`;g+=`<text x="${a.x+88}" y="${a.y+17}" text-anchor="middle" fill="#193047" font-size="11" font-weight="700">${n.id}${n.decision?' · GATE':''}</text><text x="${a.x+88}" y="${a.y+35}" text-anchor="middle" fill="#193047" font-size="11">${wrap(n.label).map((v,j)=>`<tspan x="${a.x+88}" dy="${j?14:0}">${xesc(v)}</tspan>`).join('')}</text></g>`});
g+='</svg>';document.getElementById('sl-scroll').innerHTML=g;document.querySelectorAll('[data-step]').forEach(el=>{el.onclick=()=>{focus=+el.dataset.step;detail()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();let k=Math.max(0,Math.min(m.nodes.length-1,+el.dataset.step+(e.key==='ArrowRight'?1:-1)));document.querySelector(`[data-step="${k}"]`).focus();focus=k;detail()}}});
document.getElementById('sl-register').innerHTML='<table class="sl-table"><thead><tr><th>Step</th><th>Responsible lane</th><th>Gate / control intent</th><th>Evidence</th><th>Handoff</th></tr></thead><tbody>'+m.nodes.map((n,i)=>`<tr><td>${n.id} ${xesc(n.label)}</td><td>${lanes[n.lane]}</td><td>${xesc(n.detail)}</td><td>${xesc(n.evidence)}</td><td>${i<m.nodes.length-1?xesc(lanes[m.nodes[i+1].lane])+' · linked outcome / record references':'End: retained outcome'}</td></tr>`).join('')+'</tbody></table>';detail()}
function detail(){let m=models[selected],n=m.nodes[focus],prev=m.nodes[focus-1],next=m.nodes[focus+1];let values={'Responsible / proposed accountable':lanes[n.lane]+' / accountable role to confirm','Action and control intent':n.detail,'Input':prev?prev.id+' outcome and linked identifiers':'Approved trigger context / initiating request','Output / handoff':next?next.id+' — '+lanes[next.lane]+'; outcome, record references and applicable control evidence':'Final disposition and retained evidence references','Integration / acknowledgment':'Mechanism, synchronous/asynchronous behavior and success acknowledgment TBD; telemetry is asynchronous where described.','Failure / timeout':m.extra.filter(e=>e.from===focus).map(e=>e.label+' → '+m.nodes[e.to].id).join('; ')||'Record failure, apply bounded retry if approved, then route to responsible owner; timeout and escalation policy TBD.','Requirement / control mapping':n.req+'; control definition and verifier require approval.','Evidence':n.evidence+'; evidence location and retention TBD.','Identifiers':'As available: Request ID, Asset ID, principal, deployment, environment, grant, policy version, trace, case, exception and factsheet reference. No secrets.','Status / scope / target':'Suggested target architecture · Scope to confirm · Service-level target TBD'};document.getElementById('sl-detail').innerHTML=`<div class="sl-detail"><h4>${n.id} — ${xesc(n.label)}</h4><dl>${Object.entries(values).map(([k,v])=>`<dt>${xesc(k)}</dt><dd>${xesc(v)}</dd>`).join('')}</dl></div>`}
const original=R;R=function(){original();install()};install();
})();
</script>
</body></html>
